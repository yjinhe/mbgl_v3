services:
  tangji-api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        BUILD_SHA: ${BUILD_SHA:-unknown}
    image: "${TANGJI_API_IMAGE:-tangji-api}:${IMAGE_TAG:-dev}"
    restart: unless-stopped
    init: true
    cpus: "${API_CPU_LIMIT:-1.0}"
    mem_limit: "${API_MEMORY_LIMIT:-768m}"
    pids_limit: ${API_PIDS_LIMIT:-256}
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: file:/data/prod.db
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - tangji_api_data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 30s

volumes:
  tangji_api_data:

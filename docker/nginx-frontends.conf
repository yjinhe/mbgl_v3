upstream tangji_api {
  server tangji-api:3001;
  keepalive 16;
}

# The host HTTPS proxy is the only trusted hop (see docs/DOCKER-FULL-DEPLOY.md). It reaches this
# container over the Docker bridge, so accept X-Forwarded-For only from private peers; the real
# client address then lands in $remote_addr and is forwarded as a single value. A request that
# reaches this container directly keeps its true peer address and cannot spoof the header.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

map $http_x_forwarded_proto $tangji_forwarded_proto {
  default $scheme;
  http http;
  https https;
}

server_tokens off;
client_max_body_size 64k;

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;

proxy_connect_timeout 5s;
proxy_read_timeout 30s;
proxy_send_timeout 30s;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html/web;
  index index.html;

  location /api/ {
    client_max_body_size 256k;
    proxy_pass http://tangji_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $tangji_forwarded_proto;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html/console;
  index index.html;

  location /api/ {
    client_max_body_size 256k;
    proxy_pass http://tangji_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $tangji_forwarded_proto;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

name: release-gates

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  PNPM_VERSION: 10.33.1

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  security:
    name: Full dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm audit --audit-level high

  migration:
    name: Migration integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: file:/tmp/tangji-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialize empty SQLite file
        run: install -m 600 /dev/null /tmp/tangji-ci.db
      - name: Apply migrations to a clean database
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy
      - name: Verify migration status
        working-directory: apps/api
        run: pnpm exec prisma migrate status
      - name: Detect schema drift
        working-directory: apps/api
        run: >-
          pnpm exec prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-migrations prisma/migrations
          --shadow-database-url file:/tmp/tangji-ci-shadow.db
          --exit-code

  e2e:
    name: Browser workflows
    needs: [quality, migration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:/tmp/tangji-e2e.db
      JWT_SECRET: ci-only-secret
      WECHAT_MOCK: "true"
      WEB_ORIGIN: http://127.0.0.1:5173,http://127.0.0.1:5174
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker build (${{ matrix.name }})
    needs: [quality, security, migration, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: Dockerfile.api
            image: tangji-api
          - name: frontends
            file: Dockerfile.frontend
            image: tangji-frontends
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.image }}:ci-${{ github.sha }}
          build-args: |
            APP_VERSION=ci-${{ github.run_number }}
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

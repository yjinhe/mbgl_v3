<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>糖迹 V3 · 患者端 + 药房后台 双端高保真交互原型</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<style>
/* ========== 设计令牌 ========== */
:root{
  --ink:#16302B;            /* 松墨 */
  --ink-2:#41534E;
  --ink-3:#7A8A85;
  --paper:#F2F5F3;          /* 屏内底色 */
  --card:#FFFFFF;
  --line:#E4EAE7;
  --brand:#0E7E6B;          /* 临床青绿 */
  --brand-deep:#0A5A4C;
  --brand-soft:#E2F1EC;
  --ok:#19A77E;             /* 达标 */
  --ok-soft:#E4F5EE;
  --hi:#E8833A;             /* 偏高 */
  --hi-soft:#FCEFE3;
  --danger:#D6453D;         /* 低血糖 / 显著偏高 */
  --danger-soft:#FBE9E7;
  --lo:#4A7DDB;             /* 偏低 */
  --lo-soft:#E9F0FC;
  --desk:#0F2420;           /* 桌面背景 */
  --r-card:18px;
  --shadow-card:0 1px 2px rgba(22,48,43,.05),0 6px 18px rgba(22,48,43,.05);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","MiSans","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input{font-family:inherit;border:none;outline:none;background:none;color:inherit}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);background:var(--desk);
  background-image:radial-gradient(1200px 700px at 70% -10%,rgba(25,167,126,.14),transparent 60%),
                   radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 0);
  background-size:auto,26px 26px;
}
::-webkit-scrollbar{width:0;height:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ========== 舞台与说明 ========== */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:48px;padding:36px 20px}
.side{max-width:300px;color:#BFD4CC}
.side .eyebrow{font-size:12px;letter-spacing:.35em;color:#6FA694;margin-bottom:12px}
.side h1{font-size:30px;line-height:1.3;color:#F0F7F4;font-weight:700;margin-bottom:10px}
.side h1 em{font-style:normal;color:#5BC9A6}
.side p{font-size:13px;line-height:1.8;color:#9DB8AF;margin-bottom:22px}
.side .try{border-left:2px solid rgba(91,201,166,.45);padding-left:14px;display:grid;gap:11px}
.side .try b{display:block;font-size:12px;color:#5BC9A6;font-weight:600;letter-spacing:.12em;margin-bottom:2px}
.side .try span{font-size:12.5px;line-height:1.65;color:#AEC8BF;display:block}
@media (max-width:1040px){.side{display:none}.stage{padding:0}}

/* ========== 手机框架 ========== */
.device{padding:11px;border-radius:58px;background:linear-gradient(160deg,#22332E,#0B1714);box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06)}
.screen{width:390px;height:844px;border-radius:47px;overflow:hidden;background:var(--paper);position:relative;display:flex;flex-direction:column}
@media (max-width:480px){
  .device{padding:0;border-radius:0;box-shadow:none}
  .screen{width:100vw;height:100dvh;border-radius:0}
  .stage{padding:0}
}

/* 状态栏 + 导航栏 */
.statusbar{height:34px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 2px;font-size:13px;font-weight:600;flex:none}
.statusbar .icons{display:flex;gap:5px;align-items:center}
.navbar{height:44px;flex:none;display:flex;align-items:center;justify-content:center;position:relative}
.navbar .title{font-size:16.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.capsule{position:absolute;right:12px;top:6px;height:32px;width:87px;border-radius:16px;background:rgba(255,255,255,.65);border:1px solid rgba(22,48,43,.10);display:flex;align-items:center;justify-content:space-evenly;backdrop-filter:blur(6px)}
.capsule .dots{display:flex;gap:3px}
.capsule .dots i{width:4px;height:4px;border-radius:50%;background:var(--ink)}
.capsule .sep{width:1px;height:18px;background:rgba(22,48,43,.12)}
.capsule .target{width:17px;height:17px;border-radius:50%;border:1.6px solid var(--ink);position:relative}
.capsule .target::after{content:"";position:absolute;inset:4.5px;border-radius:50%;background:var(--ink)}

/* ========== 页面容器 ========== */
.pages{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:6px 16px 110px;display:none;overscroll-behavior:contain}
.page.on{display:block;animation:pageIn .22s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ========== 底部 Tab ========== */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px 16px;z-index:30}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:10.5px;border-radius:12px}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--brand);font-weight:600}
.fab-slot{position:relative}
.fab{position:absolute;left:50%;top:-26px;transform:translateX(-50%);width:58px;height:58px;border-radius:20px;background:linear-gradient(150deg,#15B189,var(--brand-deep));box-shadow:0 8px 20px rgba(14,126,107,.42),inset 0 1px 0 rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;transition:transform .15s ease}
.fab:active{transform:translateX(-50%) scale(.93)}
.fab svg{width:27px;height:27px}
.fab-label{position:absolute;left:50%;transform:translateX(-50%);bottom:13px;font-size:10.5px;color:var(--brand);font-weight:600;white-space:nowrap}

/* ========== 通用组件 ========== */
.card{background:var(--card);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow-card);margin-bottom:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-h .t{font-size:14.5px;font-weight:600}
.card-h .more{font-size:12px;color:var(--ink-3)}
.sec-label{font-size:12px;color:var(--ink-3);letter-spacing:.18em;margin:18px 2px 8px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.hi{background:var(--hi-soft);color:var(--hi)}
.pill.lo{background:var(--lo-soft);color:var(--lo)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.mut{background:#EFF3F1;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.chip{padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);flex:none;transition:all .12s}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.seg{display:inline-flex;background:#E8EEEB;border-radius:11px;padding:3px}
.seg button{padding:6px 14px;border-radius:9px;font-size:12.5px;color:var(--ink-3);font-weight:500}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(22,48,43,.12)}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:14px;border-radius:14px;font-size:15px;font-weight:600;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(14,126,107,.3)}
.btn.ghost{background:var(--brand-soft);color:var(--brand-deep)}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.foot-note{font-size:11px;color:var(--ink-3);line-height:1.7;text-align:center;padding:4px 10px 0}

/* ========== 首页 ========== */
.greet{padding:8px 2px 14px;display:flex;justify-content:space-between;align-items:flex-start}
.greet h2{font-size:21px;font-weight:700;line-height:1.35}
.greet .date{font-size:12px;color:var(--ink-3);margin-top:3px}
.streak{display:flex;align-items:center;gap:5px;background:linear-gradient(135deg,#FFF4E3,#FFE9CB);border:1px solid #F5DDB7;color:#B26A12;font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:999px}
.hero{background:linear-gradient(155deg,#1B4A40,#0E2C26);color:#fff;border-radius:22px;padding:19px 20px 17px;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:0 14px 30px rgba(14,44,38,.35)}
.hero::after{content:"";position:absolute;right:-46px;top:-58px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(91,201,166,.30),transparent 68%)}
.hero .lab{font-size:11.5px;color:#9FC9BB;letter-spacing:.14em;display:flex;justify-content:space-between}
.hero .read{display:flex;align-items:baseline;gap:9px;margin:7px 0 3px}
.hero .v{font-size:54px;font-weight:700;line-height:1}
.hero .u{font-size:13px;color:#9FC9BB}
.hero .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:#C5DDD4;position:relative;z-index:1}
.hero .gauge{height:7px;border-radius:99px;background:rgba(255,255,255,.16);margin-top:15px;position:relative}
.hero .gauge .band{position:absolute;top:0;bottom:0;border-radius:99px;background:rgba(91,201,166,.4)}
.hero .gauge .dot{position:absolute;top:50%;width:15px;height:15px;border-radius:50%;border:3px solid #0E2C26;transform:translate(-50%,-50%);transition:left .4s ease}
.hero .gx{display:flex;justify-content:space-between;font-size:10px;color:#7FA89B;margin-top:6px}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.stat{background:#fff;border-radius:15px;padding:12px 13px;box-shadow:var(--shadow-card)}
.stat .k{font-size:11px;color:var(--ink-3);margin-bottom:5px}
.stat .v{font-size:19px;font-weight:700}
.stat .v small{font-size:10.5px;font-weight:500;color:var(--ink-3);margin-left:2px}
.tl{display:flex;flex-direction:column;gap:0}
.tl-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.tl-item:last-child{border-bottom:none}
.tl-time{font-size:12px;color:var(--ink-3);width:42px;flex:none;padding-top:2px}
.tl-main{flex:1;display:flex;align-items:center;justify-content:space-between}
.tl-p{font-size:13px;color:var(--ink-2)}
.tl-v{font-size:16px;font-weight:700;display:flex;align-items:center;gap:7px}
#homeChart{height:118px;width:100%}
.empty{padding:26px 0;text-align:center;color:var(--ink-3);font-size:12.5px;line-height:1.8}

/* ========== 历史 ========== */
.day-h{display:flex;justify-content:space-between;align-items:baseline;margin:14px 4px 7px}
.day-h .d{font-size:13.5px;font-weight:700}
.day-h .s{font-size:11.5px;color:var(--ink-3)}
.rec{background:#fff;border-radius:15px;box-shadow:var(--shadow-card);margin-bottom:8px;padding:13px 15px;display:flex;align-items:center;gap:12px;transition:transform .1s}
.rec:active{transform:scale(.985)}
.rec .bar{width:4px;align-self:stretch;border-radius:4px}
.rec .mid{flex:1}
.rec .l1{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600}
.rec .l1 .tm{font-weight:500;color:var(--ink-3);font-size:12px}
.rec .l2{font-size:11.5px;color:var(--ink-3);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}
.rec .val{font-size:21px;font-weight:700;text-align:right}
.rec .val small{display:block;font-size:10px;color:var(--ink-3);font-weight:500;margin-top:1px}

/* ========== 统计 ========== */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.metric{background:#fff;border-radius:15px;padding:13px 14px;box-shadow:var(--shadow-card)}
.metric .k{font-size:11px;color:var(--ink-3);display:flex;justify-content:space-between;align-items:center}
.metric .v{font-size:23px;font-weight:700;margin-top:5px}
.metric .v small{font-size:11px;color:var(--ink-3);font-weight:500;margin-left:2px}
.metric .sub{font-size:10.5px;color:var(--ink-3);margin-top:3px}
.tirbar{height:10px;border-radius:99px;overflow:hidden;display:flex;margin:10px 0 7px}
.tirbar i{height:100%}
.tirlegend{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3)}
.tirlegend b{color:var(--ink);font-weight:600}
#trendChart{height:215px;width:100%}
#scatterChart{height:205px;width:100%}
.chart-cap{font-size:10.5px;color:var(--ink-3);text-align:right;margin-top:4px}

/* ========== 报告页 ========== */
.subpage{position:absolute;inset:0;background:var(--paper);z-index:40;display:none;flex-direction:column}
.subpage.on{display:flex;animation:slideIn .26s ease}
@keyframes slideIn{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.sub-nav{height:44px;flex:none;display:flex;align-items:center;padding:0 8px;position:relative;justify-content:center}
.sub-nav .back{position:absolute;left:6px;padding:8px;display:flex}
.sub-nav .back svg{width:21px;height:21px;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sub-nav .t{font-size:16px;font-weight:600}
.sub-body{flex:1;overflow-y:auto;padding:8px 16px 30px}
.report{background:#fff;border-radius:20px;box-shadow:var(--shadow-card);overflow:hidden;margin-bottom:14px}
.rp-head{background:linear-gradient(150deg,#13443B,#0C2A24);color:#fff;padding:19px 20px}
.rp-head .brand{display:flex;align-items:center;gap:7px;font-size:12px;color:#9FC9BB;letter-spacing:.22em;margin-bottom:9px}
.rp-head h3{font-size:20px;font-weight:700}
.rp-head .rg{font-size:12px;color:#C5DDD4;margin-top:4px}
.rp-grid{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.rp-grid div{padding:13px 6px;text-align:center;border-right:1px solid var(--line)}
.rp-grid div:last-child{border-right:none}
.rp-grid .k{font-size:10px;color:var(--ink-3);margin-bottom:4px}
.rp-grid .v{font-size:16.5px;font-weight:700}
.rp-sec{padding:15px 18px;border-bottom:1px solid var(--line)}
.rp-sec h4{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.rp-sec h4::before{content:"";width:3.5px;height:13px;border-radius:3px;background:var(--brand)}
table.rp-tab{width:100%;border-collapse:collapse;font-size:12px}
table.rp-tab th{font-weight:500;color:var(--ink-3);text-align:left;padding:5px 4px;border-bottom:1px solid var(--line);font-size:11px}
table.rp-tab td{padding:7px 4px;border-bottom:1px dashed var(--line)}
table.rp-tab tr:last-child td{border-bottom:none}
#reportChart{height:140px;width:100%}
.rp-foot{padding:13px 18px;font-size:10.5px;color:var(--ink-3);line-height:1.7;background:#FAFCFB}
.rp-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ========== 我的 ========== */
.me-head{display:flex;align-items:center;gap:13px;padding:12px 4px 16px}
.avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(140deg,#15B189,#0A5A4C);display:flex;align-items:center;justify-content:center;font-size:25px;flex:none;box-shadow:0 6px 14px rgba(14,126,107,.3)}
.me-head .n{font-size:17px;font-weight:700}
.me-head .d{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.cell{display:flex;align-items:center;gap:11px;padding:13px 2px;border-bottom:1px solid var(--line)}
.cell:last-child{border-bottom:none}
.cell .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.cell .ic svg{width:16.5px;height:16.5px;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;fill:none}
.cell .cm{flex:1}
.cell .ct{font-size:14px;font-weight:500}
.cell .cs{font-size:11px;color:var(--ink-3);margin-top:2px;line-height:1.5}
.cell .cv{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:4px}
.cell .chev{width:15px;height:15px;stroke:var(--ink-3);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.stepper{display:flex;align-items:center;gap:1px;background:#EDF2EF;border-radius:9px;padding:2px}
.stepper button{width:29px;height:27px;border-radius:7px;font-size:16px;color:var(--brand-deep);font-weight:600;display:flex;align-items:center;justify-content:center}
.stepper button:active{background:#fff}
.stepper .sv{min-width:43px;text-align:center;font-size:13.5px;font-weight:700}
.switch{width:46px;height:27px;border-radius:99px;background:#D8E0DC;position:relative;transition:background .18s;flex:none}
.switch::after{content:"";position:absolute;top:2.5px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.22);transition:left .18s}
.switch.on{background:var(--ok)}
.switch.on::after{left:21px}
.danger-text{color:var(--danger)!important}

/* ========== 录入弹层 ========== */
.mask{position:absolute;inset:0;background:rgba(12,26,22,.45);backdrop-filter:blur(2px);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#FBFDFC;border-radius:26px 26px 0 0;z-index:60;transform:translateY(105%);transition:transform .28s cubic-bezier(.32,.72,.25,1);max-height:92%;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(12,26,22,.25)}
.sheet.on{transform:none}
.sheet-h{padding:15px 18px 4px;display:flex;align-items:center;justify-content:space-between;flex:none}
.sheet-h .t{font-size:16px;font-weight:700}
.sheet-h .x{width:30px;height:30px;border-radius:50%;background:#EDF2EF;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink-2)}
.sheet-body{overflow-y:auto;padding:2px 18px 14px}
.time-row{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3);background:#EFF4F1;border-radius:999px;padding:6px 12px;margin:4px 0 6px}
.time-row input{font-size:12.5px;color:var(--ink-2);width:172px}
.bignum{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:10px 0 2px;min-height:84px}
.bignum .bv{font-size:64px;font-weight:700;line-height:1;transition:color .15s}
.bignum .bu{font-size:14px;color:var(--ink-3)}
.bignum .cursor{display:inline-block;width:3px;height:48px;background:var(--brand);border-radius:2px;animation:blink 1.05s step-end infinite;align-self:center}
@keyframes blink{50%{opacity:0}}
.live-status{text-align:center;height:24px;font-size:12.5px;font-weight:600;margin-bottom:6px}
.f-label{font-size:11.5px;color:var(--ink-3);margin:9px 2px 7px;font-weight:600;display:flex;align-items:center;gap:6px}
.f-label .hint{font-weight:400;color:var(--brand);background:var(--brand-soft);border-radius:99px;padding:1px 8px;font-size:10.5px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pgrid .chip{text-align:center;padding:8px 4px}
.pgrid .chip.on{background:var(--brand);border-color:var(--brand)}
.tagrow{display:flex;gap:7px;flex-wrap:wrap}
.note-in{width:100%;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px;font-size:13px;margin-top:2px}
.keypad{flex:none;background:#EBF0ED;padding:9px 9px 14px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:54px;gap:7px;border-radius:22px 22px 0 0}
.key{background:#fff;border-radius:11px;font-size:22px;font-weight:600;color:var(--ink);box-shadow:0 1px 1px rgba(22,48,43,.14);display:flex;align-items:center;justify-content:center;transition:transform .08s}
.key:active{transform:scale(.94);background:#F4F8F6}
.key.fn{background:#DEE7E2;font-size:18px}
.key.save{grid-row:span 3;background:var(--brand);color:#fff;font-size:16.5px;font-weight:700;writing-mode:vertical-lr;letter-spacing:.3em;box-shadow:0 4px 12px rgba(14,126,107,.35)}
.key.save:active{background:var(--brand-deep)}

/* ========== 浮层组件 ========== */

 else{sheet.editing=null;sheet.manual=false;sheet.buf='';sheet.tags=new Set();

  rec={sbp:s,dbp:d,pulse:sheet.bp.pulse?+sheet.bp.pulse:null,period:sheet.period,tags:[...sheet.tags]}}
 else if(mk==='lipid'){rec={fasting:sheet.lipid.fasting};let any=false;

   if(!isNaN(v)){if(v<0.1||v>30){toast('血脂数值超出有效范围（0.1–30 mmol/L）');return}rec[it.k]=+v.toFixed(2);any=true}else rec[it.k]=null}

 else{const v=parseInt(sheet.buf);if(isNaN(v)){toast('请输入尿酸值');return}
  if(v<50||v>1500){toast('请输入有效范围内的数值（50–1500 μmol/L）');return}
  rec={v,fasting:sheet.uricFast}}
 rec.t=t;rec.note=note;
 if(sheet.editing){const old=u.records[mk].find(x=>x.id===sheet.editing);Object.assign(old,rec);toast('已更新');rec=old}

}
function fakeQR(canvas,code){const ctx=canvas.getContext('2d'),n=21,s=canvas.width/n;
 let h=0;for(const ch of code)h=(h*31+ch.charCodeAt(0))>>>0;
 const lcg=()=>{h=(h*1664525+1013904223)>>>0;return h/4294967296};
 ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#16302B';
 const finder=(x,y)=>{ctx.fillRect(x*s,y*s,7*s,7*s);ctx.fillStyle='#fff';ctx.fillRect((x+1)*s,(y+1)*s,5*s,5*s);ctx.fillStyle='#16302B';ctx.fillRect((x+2)*s,(y+2)*s,3*s,3*s)};
 finder(0,0);finder(14,0);finder(0,14);
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;if(lcg()<.45)ctx.fillRect(x*s,y*s,s,s)}}

/* ================= C 端事件委托 ================= */
$('#screen').addEventListener('click',e=>{
 const tab=e.target.closest('[data-tab]');if(tab){switchTab(tab.dataset.tab);return}
 const go=e.target.closest('[data-go]');if(go){state.statMetric=go.dataset.go;switchTab('stats');return}
 const act=e.target.closest('[data-act]');
 if(act){const a=act.dataset.act;
  if(a==='openSheet'){sheet.metric=state.sheetMetric;openSheet(null)}
  else if(a==='dismiss'){closeSheet();hideASheet();$('#modal').classList.remove('on');maskOn(false)}
  else if(a==='save')saveRecord();
  else if(a==='openReport'){$('#page-report').classList.add('on');renderReport()}
  else if(a==='closeSub')document.querySelectorAll('.subpage').forEach(p=>p.classList.remove('on'));
  else if(a==='saveImg')toast('长图已保存（演示）');
  else if(a==='exportPick')showASheet([
    ...METRICS.map(m=>({t:`导出${m.n}记录（CSV）`,cb:()=>exportCSV(m.k)})),
    {t:'导出全部（ZIP 打包）',cb:()=>toast('打包导出将在正式版提供（演示）')}]);
  else if(a==='openBind'){bindPreview=null;renderBind();$('#page-bind').classList.add('on')}
  else if(a==='codeCheck'){const code=($('#codeIn').value||'').trim().toUpperCase();
   const inv=invites.find(i=>i.code===code&&!i.disabled&&i.expiresAt>new Date());
   if(inv){bindPreview={code:inv.code,ph:inv.ph,by:inv.by}}else{bindPreview=null;toast('邀请码无效或已过期')}
   renderBind()}
  else if(a==='bindConfirm'&&bindPreview){const inv=invites.find(i=>i.code===bindPreview.code);
   showModal({icon:'ℹ️',ring:'var(--brand-soft)',title:'授权数据查看',
    body:`绑定「${pharmacies[bindPreview.ph].name}」后，该药房的工作人员将可以查看你在糖迹记录的全部健康数据（血糖、血压、血脂、尿酸），用于为你提供用药提醒与健康管理服务。你可以随时在「我的 → 服务药房」解绑，解绑后立即终止其全部访问（含历史数据）。`,
    actions:[{t:'暂不'},{t:'同意并绑定',cb:()=>{const u=me();u.bound=inv.ph;u.boundAt=new Date();u.invitedBy=inv.by;inv.bound++;
     toast(`已绑定「${pharmacies[inv.ph].name}」· 可随时在本页解绑`);bindPreview=null;
     document.querySelectorAll('.subpage').forEach(p=>p.classList.remove('on'));refreshAll()}}]})}
  else if(a==='unbind'){const ph=pharmacies[me().bound];
   showModal({icon:'⚠️',ring:'var(--danger-soft)',title:`解除与「${ph.name}」的绑定？`,
    body:'解绑后该药房将立即无法查看你的任何记录（含历史数据）。如需再次获得服务，可重新输入邀请码绑定。',
    actions:[{t:'再想想'},{t:'确认解绑',warn:true,cb:()=>{me().bound=null;toast('已解绑 · 该药房已无法查看你的记录');refreshAll()}}]})}
  else if(a==='openRecycle'){renderRecycle();$('#page-recycle').classList.add('on')}
  else if(a==='logout'){let n=0;for(const k in me().records)n+=active(me().records[k]).length;
   showModal({icon:'⚠️',ring:'var(--danger-soft)',title:'注销并删除全部数据？',
    body:`将删除账号下全部 <b>${n} 条</b>健康记录及关联数据，该操作<b>不可恢复</b>。如需留底，请先导出数据。`,
    actions:[{t:'再想想'},{t:'确认注销',warn:true,cb:()=>toast('演示版不执行真实注销')}]})}
  else if(a==='disclaim')showModal({icon:'ℹ️',ring:'var(--brand-soft)',title:'免责声明',
   body:'「糖迹」仅作健康记录与统计工具，所有数据、图表、估算指标（含 GMI、TIR）与各项参考范围<b>仅供参考</b>，不构成任何诊断结论或用药建议。请勿据此自行调整药物，治疗方案请遵医嘱。',actions:[{t:'我已知晓'}]});
  else if(a==='lipidFast'){sheet.lipid.fasting=!sheet.lipid.fasting;act.classList.toggle('on',sheet.lipid.fasting)}
  else if(a==='uricFast'){sheet.uricFast=!sheet.uricFast;act.classList.toggle('on',sheet.uricFast)}
  return}
 const key=e.target.closest('[data-k]');if(key){keyTap(key.dataset.k);return}
 const ms=e.target.closest('[data-mseg]');if(ms){const k=ms.dataset.mseg;
  if(sheet.editing){if(k!==sheet.metric)toast('编辑记录时不可切换指标');return}
  if(k!==sheet.metric){sheet.metric=k;state.sheetMetric=k;sheet.buf='';sheet.tags=new Set();sheet.manual=false;
   const t=new Date($('#recTime').value||Date.now());sheet.period=k==='bp'?inferBp(t):inferG(t);renderPanel()}return}
 const bpf=e.target.closest('[data-bpf]');if(bpf){sheet.bp.f=bpf.dataset.bpf;renderPanel();return}
 const per=e.target.closest('[data-period]');if(per){sheet.period=per.dataset.period;sheet.manual=true;renderPanel();return}
 const tag=e.target.closest('[data-tag]');if(tag){const t=tag.dataset.tag;sheet.tags.has(t)?sheet.tags.delete(t):sheet.tags.add(t);renderPanel();return}
 const fl=e.target.closest('[data-filter]');if(fl){state.gFilter=fl.dataset.filter;renderHistory();return}
 const hm=e.target.closest('[data-hm]');if(hm){state.histMetric=hm.dataset.hm;renderHistory();return}
 const sm=e.target.closest('[data-sm]');if(sm){state.statMetric=sm.dataset.sm;renderStats();return}
 const rg=e.target.closest('[data-range]');if(rg){state.range=+rg.dataset.range;renderStats();return}
 const un=e.target.closest('[data-unit]');if(un&&un.dataset.unit!==state.unit){state.unit=un.dataset.unit;
  toast(`已切换为 ${uLab()} · 全部数据自动换算`);refreshC();return}
 const sx=e.target.closest('[data-sex]');if(sx&&sx.dataset.sex!==me().sex){me().sex=sx.dataset.sex;
  toast(`已更新性别 · 尿酸参考上限按 <${uricTh(me().sex)} 计算`);refreshAll();return}
 const st=e.target.closest('[data-step]');if(st){const[k,dir]=st.dataset.step.split('|'),lim={fastingLow:[3,6],fastingHigh:[5,10],postMealHigh:[6,15]}[k];
  const nv=+(clamp(state.target[k]+(+dir)*.1,lim[0],lim[1])).toFixed(1);
  const t={...state.target,[k]:nv};
  if(t.fastingLow<t.fastingHigh&&t.fastingHigh<=t.postMealHigh){state.target[k]=nv;refreshC()}return}
 const rec=e.target.closest('[data-rec]');if(rec){const[mk,id]=rec.dataset.rec.split(':');recordActions(mk,+id);return}
 const rs=e.target.closest('[data-restore]');if(rs){const[mk,id]=rs.dataset.restore.split(':');
  const r=me().records[mk].find(x=>x.id===+id);if(r){r.deletedAt=null;toast('已恢复');renderRecycle();refreshAll()}return}
});
$('#screen').addEventListener('change',e=>{
 if(e.target.id==='recTime'&&!sheet.manual&&(sheet.metric==='glucose'||sheet.metric==='bp')){
  const t=new Date(e.target.value||Date.now());sheet.period=sheet.metric==='bp'?inferBp(t):inferG(t);renderPanel()}});
$('#screen').addEventListener('input',e=>{
 if(e.target.dataset.lp){sheet.lipid[e.target.dataset.lp]=e.target.value;updateLipid()}});

/* ================= B 端事件委托 ================= */
$('#bshell').addEventListener('click',e=>{
 if(e.target.id==='bModalMask'){bModalHide();return}
 const ba=e.target.closest('[data-bact]');
 if(ba){const a=ba.dataset.bact;
  if(a==='login'){B.logged=true;$('#blogin').style.display='none';renderB()}
  else if(a==='logout'){B.logged=false;$('#blogin').style.display='flex'}
  else if(a==='newInvite'){const CS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code='';
   for(let i=0;i<8;i++)code+=CS[Math.floor(Math.random()*CS.length)];
   const inv={code,ph:'phA',by:'李雯',createdAt:new Date(),expiresAt:new Date(Date.now()+30*864e5),bound:0,disabled:false};
   invites.push(inv);bInvites();showInvite(inv)}

   (navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>btoast('已复制邀请码')).catch(()=>btoast('邀请码：'+c))}
  else if(a==='closeBModal')bModalHide();
  else if(a==='newStaff')bModal(`<div class="mt">新增员工</div>
    <input id="stName" placeholder="姓名" style="margin-bottom:9px"><input id="stUser" placeholder="登录用户名" style="margin-bottom:9px"><input id="stPass" type="password" placeholder="初始密码（≥8 位）">

  else if(a==='staffConfirm'){const n=($('#stName').value||'').trim();
   if(n){pharmacies.phA.staff.push({name:n,role:'店员',user:($('#stUser').value||'new_staff').trim()});bModalHide();btoast('已添加员工（演示）');bStaff()}else btoast('请填写姓名')}
  else if(a==='staffOff')btoast('演示版不执行停用');
  else if(a==='saveSettings')btoast('已保存（演示）');
  else if(a==='fuConfirm'){const key=ba.dataset.key;
   followUps.set(key,{by:'李雯',note:($('#fuNote').value||'').trim(),at:new Date()});
   bModalHide();btoast('已标记跟进');renderB()}
  return}
 const bv=e.target.closest('[data-bview]');if(bv){B.view=bv.dataset.bview;renderB();return}
 const cu=e.target.closest('[data-cust]');if(cu){B.sel=cu.dataset.cust;B.view='detail';B.detailMetric='glucose';B.detailRange=7;renderB();return}
 const dm=e.target.closest('[data-dm]');if(dm){B.detailMetric=dm.dataset.dm;renderB();return}
 const dr=e.target.closest('[data-dr]');if(dr){B.detailRange=+dr.dataset.dr;renderB();return}
 const cf=e.target.closest('[data-cf]');if(cf){B.cFilter=cf.dataset.cf;renderB();return}
 const ad=e.target.closest('[data-ad]');if(ad){B.aDays=+ad.dataset.ad;renderB();return}
 const am=e.target.closest('[data-am]');if(am){B.aMetric=am.dataset.am;renderB();return}
 const as=e.target.closest('[data-as]');if(as){B.aStatus=as.dataset.as;renderB();return}
 const fu=e.target.closest('[data-fu]');if(fu){const key=fu.dataset.fu;
  bModal(`<div class="mt">标记跟进</div><textarea id="fuNote" rows="3" maxlength="100" placeholder="跟进备注（选填），如：已电话提醒复测"></textarea>
   <div class="macts"><button class="bbtn line" data-bact="closeBModal">取消</button><button class="bbtn" data-bact="fuConfirm" data-key="${key}">确认</button></div>`);return}
 const qr=e.target.closest('[data-qr]');if(qr){showInvite(invites.filter(i=>i.ph==='phA')[+qr.dataset.qr]);return}
 const off=e.target.closest('[data-inv-off]');if(off){invites.filter(i=>i.ph==='phA')[+off.dataset.invOff].disabled=true;bInvites();return}
});

/* ================= 双端切换与启动 ================= */
function setPane(p){
 document.querySelectorAll('#duoSwitch button').forEach(b=>b.classList.toggle('on',b.dataset.pane===p));
 $('#paneC').classList.toggle('pane-hide',p==='b');
 $('#paneB').classList.toggle('pane-hide',p==='c');
 requestAnimationFrame(()=>{refreshC();if(B.logged)renderB()});
}
$('#duoSwitch').addEventListener('click',e=>{const b=e.target.closest('[data-pane]');if(b)setPane(b.dataset.pane)});
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{
 if(!$('#paneC').classList.contains('pane-hide'))refreshC();
 if(B.logged&&!$('#paneB').classList.contains('pane-hide'))renderB()},200)});

genAll();
setNav();
setPane(window.innerWidth>=1560?'duo':'c');
</script>
